name: Docker Image CI - sob-be

on:
  push:
    branches:
      - uat
    paths:
      - apps/vob-be/**
  pull_request:
    branches:
      - uat
    paths:
      - apps/vob-be/**
  workflow_dispatch:

jobs:
  # Uncomment the following job if SAST scanning is required in the future
  SAST-scan:
    runs-on: ubuntu-107
    continue-on-error: true
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v2

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2
        with:
          category: "/language:${{ matrix.language }}"

  # Uncomment this job for GitHub Advanced Security policy checks
  GHASPolicy:
    name: Check Existing Alerts
    runs-on: ubuntu-107
    permissions:
      contents: read
      security-events: read
      pull-requests: write
    steps:
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # - name: Advanced Security Policy as Code
      #   uses: actions/policy-as-code@main
      #   with:
      #     policy-path: policies/default.yml
      #     policy-branch: uat

  build-uat:
    runs-on: ubuntu-107
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Azure Container Registry
        uses: docker/login-action@v2
        with:
          registry: supplierportaluat.azurecr.io
          username: ${{ secrets.REGUSERNAME }}
          password: ${{ secrets.REGTOKEN }}

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y.%m.%d')" >> $GITHUB_ENV

      - name: Docker Build
        run: |
          docker build -f vob-be-dockerfile -t supplierportaluat.azurecr.io/muraai/docker-vob-be:${{ github.run_number }} .

      - name: Docker Push
        run: |
          docker push supplierportaluat.azurecr.io/muraai/docker-vob-be:${{ github.run_number }}

